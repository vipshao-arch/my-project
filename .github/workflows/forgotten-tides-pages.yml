name: Publish Forgotten Tides demo

on:
  push:
    branches: [web-playtest-20261029]
    paths:
      - 'tides/**'
      - '.github/workflows/forgotten-tides-pages.yml'
      - '.github/scripts/web_smoke.py'
      - '.github/scripts/web_art_verify.py'
      - '.github/scripts/reuse_web_evidence.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: forgotten-tides-pages
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify demo files
        run: |
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path('tides')
          manifest = json.loads((root / 'release-manifest.json').read_text(encoding='utf-8'))
          for entry in manifest['files']:
              path = root / entry['name']
              assert path.is_file(), f'Missing {path}'
              assert path.stat().st_size == entry['size'], f'Wrong size: {path}'
              assert hashlib.sha256(path.read_bytes()).hexdigest() == entry['sha256'], f'Wrong checksum: {path}'
          assert (root / 'index.html').is_file()
          assert (root / 'index.pck.parts.json').is_file()
          parts = json.loads((root / 'index.pck.parts.json').read_text())
          pack = b''.join((root / part['name']).read_bytes() for part in parts['parts'])
          assert len(pack) == parts['bytes']
          assert hashlib.sha256(pack).hexdigest() == parts['sha256']
          assert (root / 'index.wasm').is_file()
          PY
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Reuse successful gameplay evidence only for identical game files
        id: evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/reuse_web_evidence.py --mode gameplay --source-run 41590727457
      - name: Install isolated browser test dependencies
        if: steps.evidence.outputs.reusable != 'true'
        run: |
          pip install playwright psutil
          python -m playwright install --with-deps chromium
      - name: Verify browser gameplay before publication
        if: steps.evidence.outputs.reusable != 'true'
        run: python .github/scripts/web_art_verify.py --mode gameplay
        timeout-minutes: 14
      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-gameplay-evidence
          path: test-results
      - uses: actions/upload-pages-artifact@v4
        with:
          path: tides

  environment-art:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Reuse successful environment evidence only for identical game files
        id: evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/reuse_web_evidence.py --mode visual --source-run 41590727457
      - name: Install isolated browser test dependencies
        if: steps.evidence.outputs.reusable != 'true'
        run: |
          pip install playwright psutil
          python -m playwright install --with-deps chromium
      - name: Verify four environment conditions in a fresh browser
        if: steps.evidence.outputs.reusable != 'true'
        run: python .github/scripts/web_art_verify.py --mode visual
        timeout-minutes: 14
      - name: Save environment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-environment-evidence
          path: test-results

  interface-art:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Reuse successful panel evidence only for identical game files
        id: evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/reuse_web_evidence.py --mode ui_panels --source-run 41590727457
      - name: Install isolated browser test dependencies
        if: steps.evidence.outputs.reusable != 'true'
        run: |
          pip install playwright psutil
          python -m playwright install --with-deps chromium
      - name: Verify business panels and world chart in a fresh browser
        if: steps.evidence.outputs.reusable != 'true'
        run: python .github/scripts/web_art_verify.py --mode ui_panels
        timeout-minutes: 18
      - name: Save interface evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-interface-evidence
          path: test-results

  combat-interface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Reuse successful broadside evidence only for identical game files
        id: evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/reuse_web_evidence.py --mode ui_combat --source-run 41575672995
      - name: Install isolated browser test dependencies
        if: steps.evidence.outputs.reusable != 'true'
        run: |
          pip install playwright psutil
          python -m playwright install --with-deps chromium
      - name: Verify Q charge, release and independent broadside reload
        if: steps.evidence.outputs.reusable != 'true'
        run: python .github/scripts/web_art_verify.py --mode ui_combat
        timeout-minutes: 18
      - name: Save combat interface evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-combat-interface-evidence
          path: test-results

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: [package, environment-art, interface-art, combat-interface]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy demo
        id: deployment
        uses: actions/deploy-pages@v4
